<!doctype html><html><head><meta charset="utf-8"><title>measure</title></head><body><pre id="out">waiting...</pre><script>
(function(){
  var f = document.createElement('iframe');
  f.src = location.search.substring(1);
  f.style.width = '1200px'; f.style.height = '3000px'; f.style.border = '0';
  document.body.appendChild(f);
  setTimeout(function(){
    try {
      var d = f.contentDocument;
      var lines = [];
      function rect(sel, label){
        var els = d.querySelectorAll(sel);
        for (var i=0;i<els.length;i++){
          var e = els[i];
          var r = e.getBoundingClientRect();
          var info = e.getAttribute('title') || e.getAttribute('src') || '';
          if (info.length > 90) info = info.substring(0,90);
          lines.push(label+'#'+i+' x='+Math.round(r.x)+' y='+Math.round(r.y)+' w='+Math.round(r.width)+' h='+Math.round(r.height)+'  ['+info+']');
        }
      }
      rect('.cms-embed-wrap', 'wrap');
      rect('.lvp', 'lvp');
      rect('video', 'video');
      rect('iframe', 'iframe');
      rect('#showcase_large', 'showcase');
      rect('.video-container', 'vcontainer');
      lines.push('d.body.scrollHeight='+d.body.scrollHeight);
      document.getElementById('out').textContent = lines.join('\n');
    } catch(e){ document.getElementById('out').textContent = 'ERR '+e; }
  }, 12000);
})();
</script></body></html>
